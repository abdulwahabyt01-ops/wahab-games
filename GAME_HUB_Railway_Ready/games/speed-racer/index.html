<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff1744">
    <title>Speed Racer - GAME HUB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <div class="logo">🎮 GAME <span>HUB</span></div>
    <a href="/">← BACK TO GAME HUB</a>
</header>

<main class="game-page">

    <div class="game-header">
        <p>SPEED RACER</p>
        <h1>🏎️ Dodge the Traffic!</h1>

        <div class="stats">
            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>Speed</span>
                <strong id="speed">1</strong>
            </div>
        </div>
    </div>

    <section id="road" class="road">

        <div id="startScreen" class="message">
            <h2>Ready to Race?</h2>
            <p>Use ← → or A/D to move your car.</p>
            <button id="startButton">START RACE</button>
        </div>

        <div id="player" class="car player-car">🏎️</div>
        <div class="mobile-controls">
    <button id="leftButton">⬅ LEFT</button>
    <button id="rightButton">RIGHT ➡</button>
    </div>

    </section>

    <div class="instructions">
        <h2>How to Play</h2>
        <p>
            Move left and right to avoid the traffic.
            Survive as long as possible and increase your score.
        </p>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
