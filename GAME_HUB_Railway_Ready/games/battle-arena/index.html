<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff1744">

    <title>Battle Arena - GAME HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">

    <div class="logo">
        🎮 GAME <span>HUB</span>
    </div>

    <a href="/">
        ← BACK TO GAME HUB
    </a>

</header>


<main class="game-page">

    <section class="game-header">

        <p>BATTLE ARENA</p>

        <h1>⚔️ Arena Challenge</h1>

        <div class="stats">

            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>Time</span>
                <strong id="time">30</strong>
            </div>

        </div>

    </section>


    <section id="arena" class="arena">

        <div id="startScreen" class="message">

            <h2>Ready for the Arena?</h2>

            <p>
                Move your player and collect the glowing points.
            </p>

            <button id="startButton">
                START BATTLE
            </button>

        </div>


        <div id="player" class="player">
            🛡️
        </div>


        <div class="mobile-controls">

            <button id="upButton">⬆</button>

            <div>
                <button id="leftButton">⬅</button>
                <button id="downButton">⬇</button>
                <button id="rightButton">➡</button>
            </div>

        </div>

    </section>


    <section class="instructions">

        <h2>How to Play</h2>

        <p>
            Use the arrow keys or WASD to move your player.
            Collect the glowing points before the timer reaches zero.
        </p>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
