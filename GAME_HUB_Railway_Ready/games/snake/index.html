<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff1744">

    <title>Snake Classic - GAME HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">

    <div class="logo">
        🎮 GAME <span>HUB</span>
    </div>

    <a href="/">
        ← BACK TO GAME HUB
    </a>

</header>


<main class="game-page">

    <section class="game-header">

        <p>SNAKE CLASSIC</p>

        <h1>🐍 Eat, Grow & Survive!</h1>

        <div class="stats">

            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>High Score</span>
                <strong id="highScore">0</strong>
            </div>

        </div>

    </section>


    <section class="game-area">

        <div id="startScreen" class="message">

            <h2>Ready to Play?</h2>

            <p>
                Control the snake and collect the food.
            </p>

            <button id="startButton">
                START GAME
            </button>

        </div>


        <canvas id="gameCanvas"></canvas>


        <div class="mobile-controls">

            <button id="upButton">⬆️</button>

            <div>
                <button id="leftButton">⬅️</button>
                <button id="downButton">⬇️</button>
                <button id="rightButton">➡️</button>
            </div>

        </div>

    </section>


    <section class="instructions">

        <h2>How to Play</h2>

        <p>
            Use the arrow keys, WASD, or the touch buttons.
            Eat the food to grow and increase your score.
            Don't hit the walls or yourself!
        </p>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
