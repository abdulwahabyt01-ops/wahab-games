
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff1744">

    <title>Ping Pong - GAME HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">

    <div class="logo">
        🎮 GAME <span>HUB</span>
    </div>

    <a href="/">
        ← BACK TO GAME HUB
    </a>

</header>


<main class="game-page">

    <section class="game-header">

        <p>PING PONG</p>

        <h1>🏓 Beat the Computer!</h1>

        <div class="stats">

            <div>
                <span>You</span>
                <strong id="playerScore">0</strong>
            </div>

            <div>
                <span>Computer</span>
                <strong id="computerScore">0</strong>
            </div>

        </div>

    </section>


    <section class="game-area">

        <div id="startScreen" class="message">

            <h2>Ready to Play?</h2>

            <p>
                Move your paddle and defeat the computer!
            </p>

            <button id="startButton">
                START GAME
            </button>

        </div>


        <canvas id="gameCanvas"></canvas>


        <div class="mobile-controls">

            <button id="upButton">
                ⬆️ UP
            </button>

            <button id="downButton">
                ⬇️ DOWN
            </button>

        </div>

    </section>


    <section class="instructions">

        <h2>How to Play</h2>

        <p>
            Use the UP and DOWN keys to move your paddle.
            Stop the ball from passing your side and score
            against the computer.
        </p>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
