<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff1744">

    <title>Target Strike - GAME HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">

        <div class="logo">
            🎮 GAME <span>HUB</span>
        </div>

        <a href="/">
            ← BACK TO GAME HUB
        </a>

    </header>


    <main class="game-page">

        <section class="game-header">

            <p>TARGET STRIKE</p>

            <h1>🎯 Hit the Targets!</h1>

            <div class="stats">

                <div>
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <span>Time</span>
                    <strong id="time">30</strong>
                </div>

            </div>

        </section>


        <section id="gameArea" class="game-area">

            <div id="message" class="message">
                <h2>Ready?</h2>
                <p>Click the START button to begin.</p>

                <button id="startButton">
                    START GAME
                </button>
            </div>

        </section>


        <section class="instructions">

            <h2>How to Play</h2>

            <p>
                Click the target as quickly as you can.
                Every successful hit gives you points.
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
